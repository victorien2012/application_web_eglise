server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Taille max des uploads (doit couvrir audio/video).
    client_max_body_size 1024M;

    # Fichiers statiques du front avec cache long pour les assets versionnes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API Django.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Espace d'administration Django et fichiers statiques associes.
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
    }

    # Fichiers medias uploades: servis directement par nginx depuis le volume partage.
    # (En production avec USE_S3=True, les medias sont servis par S3/CDN et ce bloc est inutilise.)
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Routage SPA: toutes les autres routes renvoient index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
